    .nearby-toolbar{display:flex;gap:10px;align-items:center;margin-bottom:18px;flex-wrap:wrap}.nearby-filter{height:42px;padding:0 14px;border:1px solid #ccd4c5;border-radius:10px;background:#fff;color:var(--ink)}.nearby-search{height:42px;min-width:260px;flex:1;border:1px solid #ccd4c5;border-radius:10px;padding:0 14px;background:#fff;color:var(--ink);outline:0}.nearby-search:focus{border-color:var(--green);box-shadow:0 0 0 3px #80c40022}.nearby-count{margin-left:auto;color:#7c8991;font-size:14px}
    .nearby-layout{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(400px,.85fr);gap:22px;align-items:stretch}.nearby-map{min-height:620px;border-radius:22px;position:relative;overflow:hidden;background:linear-gradient(25deg,transparent 46%,#9acb56 47% 48%,transparent 49%),linear-gradient(142deg,transparent 32%,#c1d99a 33% 34%,transparent 35%),repeating-linear-gradient(0deg,#edf4e3 0 48px,#e3edd6 49px 51px);box-shadow:inset 0 0 0 1px #d9e5ca}.nearby-map:before{content:'';position:absolute;inset:10% 14%;border:2px solid #d4e4ba;border-radius:48% 52% 44% 56%;transform:rotate(-13deg)}.nearby-map:after{content:'杭州 · 西湖区';position:absolute;top:24px;left:24px;padding:11px 15px;border-radius:10px;background:#fff;color:var(--ink);font-size:17px;font-weight:600;box-shadow:0 4px 12px #34431a1a}.nearby-map-pin{position:absolute;width:18px;height:18px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--orange);box-shadow:0 0 0 7px #e58a4a33}.nearby-map-pin:after{content:'';position:absolute;width:6px;height:6px;border-radius:50%;background:#fff;left:6px;top:6px}.pin-one{left:38%;top:38%}.pin-two{left:64%;top:57%;background:var(--green);box-shadow:0 0 0 7px #80c40033}.pin-three{left:25%;top:67%;background:#456b9e;box-shadow:0 0 0 7px #456b9e33}.nearby-map-label{position:absolute;right:20px;bottom:20px;background:#fff;border-radius:12px;padding:12px 15px;color:#607348;font-size:14px;box-shadow:0 4px 12px #34431a1a}.nearby-list{display:grid;gap:12px;align-content:start}.nearby-list-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}.nearby-list-head h2{font-size:24px;margin:0}.nearby-list-head span{font-size:14px;color:#7e8a91}.nearby-card{display:grid;grid-template-columns:82px 1fr;gap:16px;padding:17px;border:1px solid var(--line);border-radius:16px;background:#fff;transition:.2s}.nearby-card:hover{transform:translateY(-2px);box-shadow:0 10px 24px #0d19350d}.nearby-card-thumb{width:82px;height:82px;border-radius:12px;object-fit:cover}.nearby-card h3{font-size:18px;margin:0 0 5px}.nearby-card p{margin:0;color:#77848d;font-size:14px;line-height:1.55}.nearby-card-meta{display:flex;gap:12px;margin-top:9px;font-size:13px}.nearby-distance{color:#668c00}.nearby-open{color:#c87532}.nearby-route{margin-top:10px;color:#567b00;font-size:14px;text-decoration:underline;text-underline-offset:4px}.nearby-empty{padding:18px;border:1px dashed #cdd8bf;border-radius:14px;color:#7c8991;text-align:center;background:#fff}

<body>
  <div class="topline"></div>
  <header>
    <button class="brand" onclick="go('home')" aria-label="回到首页">Vintold <img class="brand-icon" src="hammer.png" alt=""></button>
    <nav class="nav" aria-label="主导航">
      <button data-route="home" onclick="go('home')">首页</button><button data-route="latest" onclick="go('latest')">最新的</button><button data-route="contribute" onclick="go('contribute')">贡献</button><button data-route="community" onclick="go('community')">社区</button><button data-route="nearby" onclick="go('nearby')">附近</button>
      <button class="cart" onclick="openCartDrawer()" aria-label="购物车"><img src="购物车.png" alt=""><b id="cartCount">0</b></button><button class="login" onclick="openModal()">注册/登录</button>
    </nav>
  </header>
  <main id="app"></main>
  <footer><span>Vintold · 让旧物重新被看见</span><button onclick="go('about')">关于项目</button></footer>
  <div class="modal" id="authModal"><div class="modal-box"><button class="close" onclick="closeModal()">×</button><div class="eyebrow">JOIN THE COMMUNITY</div><h2>加入 Vintold</h2><p>保存你的旧物故事，和附近的人一起让它继续流动。</p><div class="field"><label>手机号 / 邮箱</label><input placeholder="请输入手机号或邮箱" /></div><button class="submit" onclick="closeModal();toast('欢迎加入 Vintold 社区')">继续</button></div></div>
  <div class="login-reference-modal" id="loginReferenceModal" role="dialog" aria-modal="true" aria-labelledby="loginReferenceTitle">
    <section class="login-reference-panel">
      <button class="login-reference-close" onclick="closeModal()" aria-label="关闭">×</button>
      <div class="login-reference-logo" aria-hidden="true"><img src="hammer.png" alt="Vintold 标志"></div>
      <h2 id="loginReferenceTitle">登录账户</h2>
      <p class="login-reference-switch">新用户？ <button type="button" onclick="openSignupModal()">加入我们.</button></p>
      <button class="login-reference-social" type="button" onclick="toast('正在使用 Google 登录')"><span class="login-reference-icon google"><img src="谷歌.png" alt="Google"></span><span>用谷歌账户登录</span></button>
      <button class="login-reference-social" type="button" onclick="toast('正在使用 Apple 登录')"><span class="login-reference-icon apple"><img src="苹果.png" alt="Apple"></span><span>使用 Apple 登录</span></button>
      <button class="login-reference-social" type="button" onclick="toast('正在使用 Facebook 登录')"><span class="login-reference-icon facebook">f</span><span>以脸书账户登陆</span></button>
      <div class="login-reference-divider"><span>或</span></div>
      <label class="login-reference-label" for="loginReferenceEmail">电子邮箱地址</label>
      <input class="login-reference-email" id="loginReferenceEmail" type="email" placeholder="19817814517@163.com">
      <button class="login-reference-submit" type="button" onclick="submitReferenceLogin()">使用电子邮件登录</button>
    </section>
  </div>
  <div class="signup-reference-modal" id="signupReferenceModal" role="dialog" aria-modal="true" aria-labelledby="signupReferenceTitle">
    <button class="signup-reference-close" onclick="closeModal()" aria-label="关闭">×</button>
    <div class="signup-reference-login">已经有一个账号？ <button type="button" onclick="openModal()">登录.</button></div>
    <div class="signup-reference-layout">
      <section class="signup-reference-intro">
        <div class="eyebrow">JOIN THE COMMUNITY</div>
        <h2 id="signupReferenceTitle">加入世界上最友好的维护社区</h2>
        <div class="signup-benefit"><span class="signup-benefit-icon">✣</span><span>向志同道合的维护者学习</span></div>
        <div class="signup-benefit"><span class="signup-benefit-icon">↗</span><span>分享你的专业维修知识</span></div>
        <div class="signup-benefit"><span class="signup-benefit-icon">✦</span><span>参与进来，让旧物继续流动</span></div>
      </section>
      <section class="signup-reference-card">
        <button class="signup-social" type="button" onclick="toast('正在使用 Google 注册')"><img src="谷歌.png" alt="Google"><span>使用 Google 账号注册</span></button>
        <button class="signup-social" type="button" onclick="toast('正在使用 Apple 注册')"><img src="苹果.png" alt="Apple"><span>注册 Apple</span></button>
        <button class="signup-social" type="button" onclick="toast('正在使用 Facebook 注册')"><span class="signup-facebook">f</span><span>使用 Facebook 账户注册</span></button>
        <div class="signup-divider"><span>或</span></div>
        <label for="signupEmail">电子邮箱地址</label>
        <input class="signup-email" id="signupEmail" type="email" placeholder="19817814517@163.com">
        <button class="signup-submit" type="button" onclick="submitReferenceSignup()">使用电子邮件注册</button>
      </section>
    </div>
  </div>
  <div class="cart-drawer-backdrop" id="cartDrawerBackdrop" onclick="closeCartDrawer()"></div>
  <aside class="cart-drawer" id="cartDrawer" aria-label="购物车">
    <div class="cart-drawer-header"><h2>你的购物车</h2><button class="cart-drawer-close" onclick="closeCartDrawer()" aria-label="关闭购物车">×</button></div>
    <div class="cart-drawer-promo">购买一件物品，即可让它继续被看见</div>
    <div class="cart-drawer-content" id="cartDrawerContent"></div>
    <div class="cart-drawer-footer"><div class="cart-drawer-total"><span>全部的</span><strong id="cartDrawerTotal">¥ 0</strong></div><p class="cart-drawer-note">运费和税费将在结账时计算。</p><button class="cart-drawer-checkout" id="cartDrawerCheckout" disabled>去结账</button></div>
  </aside>
  <div class="toast" id="toast"></div>
  <script>
    const root=document.getElementById('app');let slide=0,cart=0;let vintoldLoggedIn=false;const slides=['vintold-hero.png','vintold-slide-2-street.webp','vintold-slide-3-mailbox.webp','vintold-slide-4-repair.png','vintold-slide-5-sewing.png','vintold-slide-6-research.jpg','vintold-slide-7-camera.png'];
    const storyData=[
      {image:'vintold-hero.png',title:'丢失一台收音机的第二次人生',desc:'从修复一件物品开始，重新连接人与记忆。',eyebrow:'OBJECT STORY',tags:['社区故事','维修服务'],caption:'一台旧收音机，记录着家庭与社区之间的时间。'},
      {image:'vintold-latest-2.png',title:'物品为什么值得被保留？',desc:'来自社区的真实访谈与故事。',eyebrow:'OBJECT STORY',tags:['社区故事','用户访谈'],caption:'当物品进入新的生活，它也重新获得了被理解的机会。'},
      {image:'vintold-latest-3-community-display.webp',title:'附近的旧物修复角',desc:'在你身边找到可靠的修理与交换。',eyebrow:'COMMUNITY NODE',tags:['社区故事','空间记录'],caption:'把维修、分享和邻里关系放回日常生活。'}
    ];
    const cards=storyData.map(c=>[c.image,c.title,c.desc]);
    function card(c,i){return `<article class="card" tabindex="0" role="button" onclick="go('story',${i})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();go('story',${i})}"><img src="${c[0]}" alt="${c[1]}" style="${i===1?'object-position:center 68%':''}"><div class="card-body"><span class="pill">社区故事</span><h3>${c[1]}</h3><p>${c[2]}</p></div></article>`}
    function home(){return `<section class="tools"><label class="search" aria-label="搜索"><span></span><input placeholder="搜索" onkeydown="if(event.key==='Enter')search(this.value)"></label><button class="tagline" onclick="go('community')">加入世界上最友好的维护社区</button></section><section class="hero ${slide===0?'':'needs-arrows color-slide'} ${slide===6?'mono-slide':''}" aria-label="旧物故事轮播"><img src="${slides[slide]}" style="${slide===1||slide===5?'object-position:center 68%':''}" alt="旧物与人的故事" onclick="openSlideStory()" role="link" tabindex="0" title="查看对应故事"><button class="arrow left" onclick="change(-1)" aria-label="上一"></button><button class="arrow right" onclick="change(1)" aria-label="下一"></button></section><div class="dots" aria-label="轮播分页">${slides.map((_,i)=>`<button class="dot ${i===slide?'active':''}" onclick="setSlide(${i})" aria-label="第${i+1}张"></button>`).join('')}${Array.from({length:Math.max(0,7-slides.length)},()=>`<button class="dot" onclick="go('latest')" aria-label="更多故事"></button>`).join('')}</div><section class="home-bottom"><button onclick="go('about')"><h2>联系我们！</h2></button><button class="primary" onclick="openRepair()">修理你的物品</button></section>`}

    function render(route='home',storyIndex=0){document.body.classList.toggle('home-mode',route==='home');document.querySelectorAll('[data-route]').forEach(b=>b.classList.toggle('active',b.dataset.route===route));if(route==='home')root.innerHTML=home();else if(route==='latest')root.innerHTML=listing('最新的故事','LATEST');else if(route==='contribute')root.innerHTML=`<section class="page"><div class="eyebrow">SHARE YOUR OBJECT</div><h1>让一件旧物继续讲故事</h1><p>上传物品照片，写下它的来历，邀请社区帮它找到新的连接。</p><form class="form" onsubmit="event.preventDefault();toast('故事已提交，感谢你的贡献');go('latest')"><div class="field"><label>物品名称</label><input required placeholder="例如：爷爷的收音"></div><div class="field"><label>它的故事</label><textarea required rows="6" placeholder="它陪伴过谁？为什么对你重要？"></textarea></div><div class="field"><label>希望的方式</label><select><option>寻找维修建议</option><option>分享给社</option><option>寻找新的主人</option></select></div><button class="submit">发布故事</button></form></section>`;else if(route==='community')root.innerHTML=`<section class="page"><div class="eyebrow">A KIND MAINTENANCE COMMUNITY</div><h1>一起维护，一起生活</h1><div class="community"><div class="panel"><h2>本周社区活动</h2><p>周六 14:00 · 老物件修复工作坊</p><p>周日 10:30 · 旧物故事分享。</p><button class="submit" onclick="toast('已为你报名活动')">报名参加</button></div><div class="panel"><h2>社区地图</h2><div class="map"></div></div></div></section>`;else if(route==='nearby')root.innerHTML=`<section class="page"><div class="eyebrow">NEARBY SERVICES</div><h1>找到你附近的修理与交换</h1><div class="community"><div class="map"></div><div class="panel"><h2>杭州 · 西湖区</h2><p>已为你找到 12 个社区节点</p><p>距离最近：南山修理铺 · 0.8 km</p><button class="submit" onclick="toast('正在为你规划路线')">查看路线</button></div></div></section>`;else if(route==='repair')root.innerHTML=`<section class="page repair-page"><div class="eyebrow">REPAIR SERVICE</div><h1>修理你的物品</h1><p>告诉我们物品的问题，我们会帮你找到合适的修理方式。</p><form class="form" onsubmit="event.preventDefault();toast('提交成功，我们会尽快联系你');go('home')"><div class="field"><label>物品名称</label><input required placehold   <script>
    const popcornStory={image:'vintold-slide-4-repair.png',title:'老式爆米花机里的童年声音',desc:'一声久违的“砰”，把城市街角的旧手艺和童年的记忆重新带回生活。',eyebrow:'COMMUNITY ARCHIVE',tags:['街头记忆','旧物故事'],caption:'一台老式爆米花机，一位守着旧手艺的老人，以及一条正在快速变化的老街。'};

    const bindPopcornCard=()=>{const grid=document.querySelector('.latest-mode .grid');if(!grid||grid.children.length<6)return;const card=grid.children[5];card.onclick=()=>go('story',5);card.onkeydown=event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();go('story',5)}}};
    const renderPopcornCase=()=>{const isPopcorn=location.hash==='#story-5';document.body.classList.toggle('case-story-mode',isPopcorn);if(!isPopcorn)return;const current=document.querySelector('.story-page');if(!current||current.dataset.caseEnhanced)return;current.outerHTML=`<section class="case-story"><a class="story-back" href="#latest" onclick="event.preventDefault();go('latest')">← 返回最新</a><header class="case-story-header"><div class="eyebrow">COMMUNITY ARCHIVE / OBJECT STORY</div><h1>${popcornStory.title}</h1><p>${popcornStory.desc}</p></header><img class="case-story-hero" src="${popcornStory.image}" alt="${popcornStory.title}"><div class="case-story-stats"><div class="case-story-stat"><strong>一声“砰”</strong><span>街角最熟悉的声音，唤回一段童年记忆。</span></div><div class="case-story-stat"><strong>七八十年代</strong><span>老式气流膨化机走进城乡生活的年代。</span></div><div class="case-story-stat"><strong>一门旧手艺</strong><span>一台机器、一位老人，守着城市的旧味道。</span></div></div><section class="case-story-section"><h2>很久没听见过那声“砰”了</h2><div><p>你有多久没在街边看见过爆米花了？不是电影院里那种裹着焦糖的桶装货，而是小时候街角的铁疙瘩——黑乎乎的葫芦形铁罐，架在炭火上转啊转，最后“砰”一声巨响，炸出一麻袋白花花的米花。</p><p>那天傍晚路过老城区，远远就看见一团火苗在路边跳。走近了才发现，是一位大爷，守着那台老式爆米花机。膝头上盖着袖套，手摇着铁罐，火舌舔着锅底，空气里飘着焦香的甘味。一瞬间，时间像倒回去了二十年。</p></div></section><section class="case-story-section"><h2>这门手艺，比我们想象的老</h2><div><p>老式爆米花机，正式的名字叫“气流膨化机”。密封的铁罐在火上旋转加热，玉米粒里的水分变成蒸汽，压力不断升高。等压力到了，师傅用铁管一撬——“砰”的一声，瞬间释压，米花就炸开了。</p><p>上世纪七八十年代，一个炉子、一个铁罐、一条长布袋，走街串巷就能养活一家人。那时候的爆米花不加糖也不加奶油，就是粮食本身最原始的那口香。</p></div></section><section class="case-story-section"><h2>他为什么还在做</h2><div><p>照片里的大爷没什么特别的表情，就是认真地转着铁罐，时不时瞧一眼压力表。旁边一位大哥背着手站着等，不急不躁，像是在等一锅老味道，也像是在等一段旧时光。</p><p>有些东西，做了就做了，不一定非要“有用”。或许是闲不住，或许是习惯了，又或许——街坊邻居还等着这一口。</p></div></section><section class="case-story-section"><h2>城市里正在消失的声音</h2><div><p>楼越来越高，路越来越宽，老街越来越少。那些曾经熟悉的街头声音——磨剪子的吼喝、弹棉花的弓弦声、爆米花的那一声巨响——正在一个接一个地消失。</p><p>它们构成了记忆里的城市气味和温度。如果有一天你在街角遇见这样一位爆米花大爷，别急着走。买一袋，拍张照，或者就是站一会儿、看一眼。因为说不定这一次，就是最后一次了。</p></div></section><p class="case-story-closing">城市往前走的时候，有些背影会慢慢淡出。我们能做的，不过是多看几眼，记在心里。</p></section>`};

          <div class="community-hero-copy"><div class="eyebrow">A KIND MAINTENANCE COMMUNITY</div><h1>一起维护，<br>一起生活</h1><p>在这里，旧物不只是被修好，也会重新连接起人与人。分享你的经验，找到附近的伙伴，让每一件物品继续参与生活。</p><div class="community-actions"><button class="submit" onclick="go('contribute')">分享一件旧物 →</button><button class="community-ghost" onclick="document.getElementById('communityFeed').scrollIntoView({behavior:'smooth'})">浏览社区动态</button></div></div>
          <div class="community-hero-art"><img src="vintold-latest-3-community-display.webp" alt="社区旧物修复角"></div>
        </div>
        <div class="community-stats"><div class="community-stat"><strong>128</strong><span>本月被重新使用的旧物</span></div><div class="community-stat"><strong>36</strong><span>正在活动的社区节点</span></div><div class="community-stat"><strong>92%</strong><span>获得帮助的维修提问</span></div></div>
        <div class="community-tabs"><button class="active" onclick="switchCommunityTab(this,'全部动态')">全部动态</button><button onclick="switchCommunityTab(this,'维修经验')">维修经验</button><button onclick="switchCommunityTab(this,'旧物故事')">旧物故事</button><button onclick="switchCommunityTab(this,'活动公告')">活动公告</button></div>
        <div class="community-content" id="communityFeed"><div class="community-feed">
          <article class="community-post"><div class="community-post-head"><div class="community-avatar">林</div><div class="community-post-meta"><strong>林阿姨 · 杭州西湖区</strong><span>2小时前 · 维修经验</span></div></div><h3>一台老缝纫机，重新开始工作</h3><p>换掉磨损的皮带，清理针槽，再给转轴上一点油。它又能安静地缝起衣服了。修理有时候不是让它回到从前，而是让它继续拥有新的日常。</p><img class="community-post-image" src="vintold-slide-2-street.webp" alt="街边缝纫机"><div class="community-post-actions"><button onclick="toggleCommunityLike(this)">♡ 24</button><button onclick="toast('评论功能即将开放')">评论 8</button><button onclick="toast('已复制分享链接')">分享</button></div></article>
          <article class="community-post"><div class="community-post-head"><div class="community-avatar" style="background:#fff0df;color:#d8752c">周</div><div class="community-post-meta"><strong>周末修理铺</strong><span>昨天 · 活动公告</span></div></div><h3>周六下午，来交换一个旧物故事</h3><p>我们会带来几件已经修复好的旧物，也欢迎你带着正在等待修理的物品来。一起喝杯茶，听听它们曾经陪伴过谁。</p><div class="community-post-actions"><button onclick="toast('已报名周六活动')">报名参加</button><button onclick="toast('活动地点：北山街道共享空间')">查看地点</button></div></article>
          <article class="community-post"><div class="community-post-head"><div class="community-avatar" style="background:#e8eef7;color:#456b9e">陈</div><div class="community-post-meta"><strong>陈先生 · 拾光小组</strong><span>3天前 · 旧物故事</span></div></div><h3>为什么我们还愿意保存一只旧信箱？</h3><p>因为它保存的不只是纸张，还有那些需要走很远才能抵达的想念。欢迎在评论里分享一件你舍不得丢掉的旧物。</p><div class="community-post-actions"><button onclick="toggleCommunityLike(this)">♡ 41</button><button onclick="toast('评论功能即将开放')">评论 12</button><button onclick="toast('已复制分享链接')">分享</button></div></article>
        </div><aside class="community-sidebar"><section class="community-side-card"><h2>热门话题</h2><div class="community-topic"><b>#我的第一件旧物</b><span>36篇</span></div><div class="community-topic"><b>#修理而不是丢弃</b><span>28篇</span></div><div class="community-topic"><b>#街坊修理角</b><span>19篇</span></div><div class="community-topic"><b>#旧物的新用途</b><span>16篇</span></div></section><section class="community-side-card"><h2>附近活动</h2><select class="community-select" onchange="toast('已切换到'+this.value)"><option>杭州 · 西湖区</option><option>杭州 · 上城区</option><option>杭州 · 拱墅区</option></select><div class="community-event"><strong>旧物修复工作坊</strong><span>周六 14:00 · 还有 8 个名额</span></div><div class="community-event"><strong>旧物故事分享会</strong><span>周日 10:30 · 北山共享空间</span></div></section><section class="community-side-card"><h2>社区守则</h2><p style="color:var(--muted);line-height:1.7;margin:0">尊重每一件物品的来历，认真回应每一次求助，让分享成为新的连接。</p></section></aside></div>
      </section>`;
    }
    function switchCommunityTab(button,label){document.querySelectorAll('.community-tabs button').forEach(item=>item.classList.remove('active'));button.classList.add('active');toast('已切换到'+label)}
    function toggleCommunityLike(button){const liked=button.dataset.liked==='1';const count=parseInt(button.textContent.replace(/\D/g,''),10)||0;button.dataset.liked=liked?'0':'1';button.textContent=(liked?'♡ ':'♥ ')+(liked?count-1:count+1)}
    const communityObserver=new MutationObserver(enhanceCommunity);
    communityObserver.observe(root,{childList:true,subtree:true});
    enhanceCommunity();
    function enhanceContribute(){
      const page=root.querySelector('.page');
      if(!page||!page.querySelector('.eyebrow')?.textContent.includes('SHARE YOUR OBJECT')||page.classList.contains('contribute-page'))return;
      root.innerHTML=`<section class="page contribute-page"><div class="contribute-layout"><section class="contribute-intro"><div class="eyebrow">SHARE YOUR OBJECT</div><h1>让一件旧物继续讲故事</h1><p>上传物品照片，写下它的来历，邀请社区帮它找到新的连接。</p><div class="contribute-notes"><p>每一件旧物，都值得被认真记录。</p><p>你的分享会成为别人修复、理解和继续使用它的起点。</p></div></section><section class="contribute-form-card"><form onsubmit="submitContribution(event,this)"><div class="contribute-field-row"><div class="field"><label for="contributeName">物品名称</label><input id="contributeName" required placeholder="例如：爷爷的收音机"></div><div class="field"><label for="contributeCategory">物品分类</label><select id="contributeCategory"><option>家用电器</option><option>家具用品</option><option>服装与手作</option><option>其他旧物</option></select></div></div><div class="field"><label for="contributeStory">它的故事</label><textarea id="contributeStory" required placeholder="它陪伴过谁？为什么对你重要？"></textarea></div><div class="contribute-field-row"><div class="field"><label for="contributeWay">希望的方式</label><select id="contributeWay"><option>寻找维修建议</option><option>分享给社区</option><option>寻找新的主人</option></select></div><div class="field"><label for="contributePhoto">添加照片</label><label class="contribute-upload" for="contributePhoto"><img src="图片.png" alt=""><span>添加图片</span></label><input id="contributePhoto" type="file" accept="image/*"></div></div><button class="contribute-submit" type="submit">发布故事 →</button></form></section></div></section>`;
      const photoInput= document.getElementById('contributePhoto');
      const photoLabel= photoInput?.previousElementSibling;
      const uploadText= photoLabel?.querySelector('span');
      if(uploadText) uploadText.textContent='此处上传文件';
      photoInput?.addEventListener('change',()=>{
        const name=photoInput.files?.[0]?.name||'此处上传文件';
        const text=photoLabel?.querySelector('span');
        if(text) text.textContent=name;
      });
    }
    function submitContribution(event){
      event.preventDefault();
      toast('故事已提交，感谢你的贡献');
      setTimeout(()=>go('latest'),500);
    }
    const contributeObserver=new MutationObserver(enhanceContribute);
    contributeObserver.observe(root,{childList:true,subtree:true});
    enhanceContribute();
  </script>
</body>
